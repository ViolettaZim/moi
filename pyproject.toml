[tool.poetry]
name = "infra-analytics"
version = "0.1.0"
description = "Library for analyzing infrastructure accessibility for green spaces"
authors = ["ViolettaZim"]
readme = "README.md"
packages = [{ include = "infra_analytics", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
geopandas = "^1.1.0"
pandas = "^3.0.0"
shapely = "^2.1.0"
pre-commit = "^3.0.0"
black = "^24.0.0"
isort = "^5.13.0"
uvicorn = "^0.49.0"
fastapi = "^0.136.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
