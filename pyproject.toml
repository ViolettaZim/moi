[project]
name = "infra-analytics"
version = "0.1.0"
description = "Library for analyzing infrastructure accessibility for green spaces"
authors = [
    { name = "ViolettaZim", email = "viozim@ya.ru" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.1.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "shapely>=2.1.0,<3.0.0",
    "pre-commit>=3.0.0,<4.0.0",
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "fastapi>=0.100.0,<1.0.0"
]

[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

